<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Evolution World - Jogo de Estratégia com IA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>AI Evolution World</h1>
            <div id="controls">
                <div class="control-group">
                    <label for="ai-count">Número de IAs:</label>
                    <input type="number" id="ai-count" min="2" max="10" value="4">
                </div>
                <button id="start-game">Iniciar Jogo</button>
                <button id="pause-game">Pausar</button>
                <button id="reset-game">Reiniciar</button>
                <div class="speed-control">
                    <label for="game-speed">Velocidade:</label>
                    <select id="game-speed">
                        <option value="1">1x</option>
                        <option value="2" selected>2x</option>
                        <option value="5">5x</option>
                        <option value="10">10x</option>
                    </select>
                </div>
            </div>
        </header>
        
        <main>
            <div id="game-world">
                <canvas id="game-canvas" width="1200" height="800"></canvas>
                <div id="minimap"></div>
            </div>
            
            <aside id="info-panel">
                <div id="game-stats">
                    <h3>Estatísticas do Jogo</h3>
                    <div id="turn-counter">Turno: 0</div>
                    <div id="active-ais">IAs Ativas: 0</div>
                </div>
                
                <div id="ai-list">
                    <h3>IAs no Jogo</h3>
                    <div id="ai-entries"></div>
                </div>
                
                <div id="selected-ai-info">
                    <h3>IA Selecionada</h3>
                    <div id="ai-details">Clique em uma IA para ver detalhes</div>
                </div>
                
                <div id="log-panel">
                    <h3>Log de Eventos</h3>
                    <div id="event-log"></div>
                </div>
            </aside>
        </main>
    </div>
    
    <script src="game.js"></script>
</body>
</html>

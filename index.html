<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Civilization - Jogo de Estratégia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>AI Civilization</h1>
            <div class="game-controls">
                <label for="ai-count">Número de IAs:</label>
                <select id="ai-count">
                    <option value="2">2 IAs</option>
                    <option value="4" selected>4 IAs</option>
                    <option value="6">6 IAs</option>
                    <option value="8">8 IAs</option>
                </select>
                <button id="start-game">Iniciar Jogo</button>
                <button id="pause-game">Pausar</button>
                <button id="reset-game">Reiniciar</button>
            </div>
        </header>

        <div class="game-main">
            <div class="game-info">
                <div class="game-stats">
                    <h3>Estatísticas do Jogo</h3>
                    <div id="game-stats">
                        <p>Época: <span id="current-era">Idade da Pedra</span></p>
                        <p>Turno: <span id="current-turn">0</span></p>
                        <p>IAs Ativas: <span id="active-ais">0</span></p>
                    </div>
                </div>
                
                <div class="ai-list">
                    <h3>IAs no Jogo</h3>
                    <div id="ai-list"></div>
                </div>
            </div>

            <div class="game-view">
                <canvas id="game-canvas" width="1200" height="800"></canvas>
                <div class="map-info">
                    <p>Clima: <span id="current-climate">Tropical</span></p>
                    <p>Recursos: <span id="available-resources">0</span></p>
                </div>
            </div>
        </div>

        <div class="game-log">
            <h3>Log de Eventos</h3>
            <div id="event-log"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
